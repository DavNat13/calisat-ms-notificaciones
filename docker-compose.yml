services:
  postgres-db:
    image: postgres:15-alpine
    container_name: calisat-db-notificaciones
    environment:
      POSTGRES_DB: calisat_notificacion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - calisat_notificacion_data:/var/lib/postgresql/data
    networks:
      - calisat-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calisat_notificacion"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: calisat-rabbitmq
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calisat-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calisat-ms-notificaciones
    ports:
      - "8087:8080"
    environment:
      # Dentro de la red compose el Postgres se resuelve por nombre de servicio
      # y la app escucha en 8080 (imagen estandar); en host usa localhost:5436:8087.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/calisat_notificacion
      SERVER_PORT: "8080"
      # Mismo patron que application.yaml: el broker se resuelve por nombre de servicio
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - calisat-net

networks:
  calisat-net:
    driver: bridge

volumes:
  calisat_notificacion_data:
  rabbitmq_data:
