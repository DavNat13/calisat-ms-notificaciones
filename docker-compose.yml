services:
  postgres-db:
    image: postgres:15-alpine
    container_name: calisat-db-notificaciones
    environment:
      POSTGRES_DB: calisat_notificacion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - calisat_notificacion_data:/var/lib/postgresql/data
    networks:
      - calisat-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calisat_notificacion"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Perfil local: activa application-local.yaml (URLs por nombre de servicio).
    command: ["java","-XX:+UseContainerSupport","-XX:MaxRAMPercentage=75.0",
              "-jar","app.jar","--spring.profiles.active=local"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calisat-ms-notificaciones
    ports:
      - "8087:8080"
    environment:
      # Dentro de la red compose el Postgres se resuelve por nombre de servicio
      # y la app escucha en 8080 (imagen estandar); en host usa localhost:5436:8087.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/calisat_notificacion
      SERVER_PORT: "8080"
      # URLs entre servicios: en EC2 separadas exportar http://<ip>:<puerto>
      CALISAT_URLS_CARRITO: ${CALISAT_URLS_CARRITO:-http://calisat-ms-carrito:8080}
      # Broker: cluster de calisat-infra/rabbitmq-cluster (misma red calisat-net)
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-calisat-rabbit1}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-calisat-app}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-Calisat2026!}
      SPRING_RABBITMQ_PORT: "5672"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - calisat-net

networks:
  calisat-net:
    # Nombre fijo: los 7 compose comparten esta misma red para que los
    # microservicios se vean entre si en local (sin IPs, por nombre de servicio).
    name: calisat-net
    driver: bridge

volumes:
  calisat_notificacion_data:
