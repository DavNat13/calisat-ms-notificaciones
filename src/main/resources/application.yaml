spring:
  application:
    name: calisat-ms-notificaciones

  datasource:
    url: jdbc:postgresql://postgres-db:5432/calisat_notificacion
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0
          audience: d221f0d2-1a7c-4872-ad6c-367a1f0717ec

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:calisat-app}
    password: ${SPRING_RABBITMQ_PASSWORD:Calisat2026!}
    listener:
      simple:
        default-requeue-rejected: false   # fallidos -> DLX/DLQ
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          multiplier: 2.0
          max-interval: 10000ms

  mail:
    host: smtp.gmail.com
    port: 587
    username: calisatspa@gmail.com
    password: cczoeqnobsilxzgm

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

